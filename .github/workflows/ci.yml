name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install '.[test]'
      - name: Compile
        run: python -m compileall -q heart
      - name: Test
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest

  distribution:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and source archive
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/heart-wheel
          /tmp/heart-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/heart-wheel/bin/python -c "import importlib.metadata as m, heart; assert m.version('heart-marl') == heart.__version__"
      - uses: actions/upload-artifact@v4
        with:
          name: heart-marl-distributions
          path: dist/
          if-no-files-found: error
