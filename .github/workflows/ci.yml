name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Compile
        run: python -m compileall -q heart submissions examples benchmarks
      - name: Lint and format
        run: |
          python -m ruff check heart submissions examples benchmarks tests
          python -m ruff format --check heart submissions examples benchmarks tests
      - name: Test
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest

  distribution:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and source archive
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/heart-wheel
          /tmp/heart-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/heart-wheel/bin/python -c "import importlib.metadata as m, heart; assert m.version('heart-marl') == heart.__version__"
          JAX_PLATFORMS=cpu /tmp/heart-wheel/bin/python - <<'PY'
          import tempfile
          from pathlib import Path

          import jax
          import jax.numpy as jnp
          import heart

          deal = heart.DealEnv()
          deal_step = jax.jit(deal.step)
          state, observation = deal.reset(jax.random.key(0))
          states = [state]
          rewards = jnp.zeros((4,), dtype=jnp.float32)
          while not bool(state.terminated):
              action = jnp.argmax(observation.action_mask)
              state, observation, rewards, _, info = deal_step(state, action)
              assert not bool(info.invalid_action)
              states.append(state)
          assert len(states) == 53
          assert int(state.penalties.sum()) == 26
          assert bool(jnp.array_equal(rewards, -state.scores))

          classic_env = heart.make("classic-v0")
          classic_step = jax.jit(classic_env.step)
          classic_state, classic_observation = classic_env.reset(jax.random.key(2))
          assert classic_observation.pass_action_mask.shape == (286,)
          for _ in range(4):
              classic_state, classic_observation, _, _, classic_info = (
                  classic_step(classic_state, 0)
              )
              assert not bool(classic_info.invalid_action)
          assert int(classic_state.phase) == heart.PLAY
          assert bool(classic_observation.play_action_mask[heart.TWO_OF_CLUBS])

          classic_single = heart.make_single_agent(
              "classic-v0", pass_opponents="easy", play_opponents="easy"
          )
          classic_single_state, classic_single_observation = classic_single.reset(
              jax.random.key(3)
          )
          assert classic_single_observation.pass_action_mask.shape == (286,)
          _, _, _, _, classic_single_info = classic_single.step(
              classic_single_state, 0
          )
          assert 1 <= int(classic_single_info.event_count) <= 7

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              assert heart.save_html(state, root / "snapshot.html").is_file()
              assert heart.save_replay_html(states, root / "replay.html").is_file()
          PY
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: heart-marl-distributions
          path: dist/
          if-no-files-found: error

  submissions:
    name: Leaderboard entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install '.[dev]'
      - name: Validate
        env:
          JAX_PLATFORMS: cpu
        run: python submissions/validate.py
