name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install '.[test,render]'
      - name: Compile
        run: python -m compileall -q heart
      - name: Lint and format
        run: |
          python -m ruff check heart examples benchmarks tests
          python -m ruff format --check heart examples benchmarks tests
      - name: Test
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest

  distribution:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and source archive
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/heart-wheel
          /tmp/heart-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/heart-wheel/bin/python -c "import importlib.metadata as m, heart; assert m.version('heart-marl') == heart.__version__"
          JAX_PLATFORMS=cpu /tmp/heart-wheel/bin/python - <<'PY'
          import tempfile
          from pathlib import Path

          import jax
          import jax.numpy as jnp
          import heart

          env = heart.make("simplest-v0")
          state, observation = env.reset(jax.random.key(0))
          states = [state]
          rewards = jnp.zeros((4,), dtype=jnp.float32)
          while not bool(state.terminated):
              action = jnp.argmax(observation.action_mask)
              state, observation, rewards, _, info = env.step(state, action)
              assert not bool(info.invalid_action)
              states.append(state)
          assert len(states) == 53
          assert int(state.penalties.sum()) == 18

          single_env = heart.make_single_agent(opponents="easy")
          single_state, single_observation = single_env.reset(jax.random.key(1))
          for _ in range(13):
              slot = jnp.argmax(single_observation.action_mask)
              single_state, single_observation, _, single_done, single_info = (
                  single_env.step(single_state, slot)
              )
              assert not bool(single_info.invalid_action)
          assert bool(single_done)
          assert int(single_state.decisions) == 13
          assert int(single_state.game.num_cards_played) == 52

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              assert heart.save_html(state, root / "snapshot.html").is_file()
              assert heart.save_replay_html(states, root / "replay.html").is_file()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heart-marl-distributions
          path: dist/
          if-no-files-found: error
